name: Package install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    name: Homebrew install (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tap this checkout, install, test and audit
        run: |
          set -eu
          brew tap local/outpace "$GITHUB_WORKSPACE"
          brew install local/outpace/outpace
          outpace --version
          brew test local/outpace/outpace
          brew audit --strict --formula local/outpace/outpace
